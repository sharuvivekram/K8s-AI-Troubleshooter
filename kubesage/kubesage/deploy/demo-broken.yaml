# Two intentionally broken pods to demonstrate KubeSage.
# Apply with: kubectl apply -f deploy/demo-broken.yaml
---
# 1. CrashLoopBackOff: the container exits immediately with an error.
apiVersion: v1
kind: Pod
metadata:
  name: demo-crashloop
  namespace: default
  labels: { demo: kubesage }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting checkout-service'; sleep 2; echo 'FATAL: cannot connect to db at db:5432' >&2; exit 1"]
---
# 2. OOMKilled: the container requests more memory than its limit allows.
apiVersion: v1
kind: Pod
metadata:
  name: demo-oom
  namespace: default
  labels: { demo: kubesage }
spec:
  containers:
    - name: hog
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
      resources:
        limits: { memory: "64Mi" }
        requests: { memory: "64Mi" }
